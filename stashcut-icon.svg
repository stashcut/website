<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Stashcut app icon: the bezel carousel, the clipping in front just snipped. -->
  <!-- Copyright (c) 2026 Khalil Gharbaoui. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D4DFF"/>
      <stop offset="0.55" stop-color="#B23CFF"/>
      <stop offset="1" stop-color="#FF4D8D"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF0FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1A0B3D" flood-opacity="0.45"/>
    </filter>
    <clipPath id="cut">
      <polygon points="292,344 612,344 732,464 732,664 292,664"/>
    </clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <g transform="translate(0 -18)">
    <rect x="150" y="392" width="260" height="224" rx="40" fill="#FFFFFF" opacity="0.28"/>
    <rect x="614" y="392" width="260" height="224" rx="40" fill="#FFFFFF" opacity="0.28"/>
    <g filter="url(#shadow)">
      <rect x="292" y="344" width="440" height="320" rx="48" fill="url(#card)" clip-path="url(#cut)"/>
    </g>
    <rect x="352" y="418" width="210" height="28" rx="14" fill="#6D4DFF" opacity="0.55"/>
    <rect x="352" y="480" width="320" height="28" rx="14" fill="#6D4DFF" opacity="0.30"/>
    <rect x="352" y="542" width="260" height="28" rx="14" fill="#6D4DFF" opacity="0.30"/>
    <polygon points="648,312 768,312 768,432" fill="#C6FF3D" transform="rotate(8 728 372)" filter="url(#shadow)"/>
    <circle cx="472" cy="722" r="13" fill="#FFFFFF" opacity="0.5"/>
    <circle cx="512" cy="722" r="13" fill="#C6FF3D"/>
    <circle cx="552" cy="722" r="13" fill="#FFFFFF" opacity="0.5"/>
  </g>
</svg>
