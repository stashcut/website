<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Stashcut app icon: the bezel carousel, the clipping in front just snipped. -->
  <!-- Flat: solid violet, white cards, a lime cut, depth from one solid offset shadow. -->
  <!-- Colours are the tokens in Branding/design.md. Copyright (c) 2026 Khalil Gharbaoui. -->
  <defs>
    <clipPath id="cut">
      <polygon points="292,344 612,344 732,464 732,664 292,664"/>
    </clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="#6D4DFF"/>
  <!-- A darker disc behind the row, so the white cards sit in a pool of light rather than on a flat wall. -->
  <circle cx="512" cy="512" r="344" fill="#5F3FF2"/>
  <g transform="translate(0 -18)">
    <!-- Side cards, faded the way the app fades them. -->
    <rect x="150" y="392" width="260" height="224" rx="40" fill="#FFFFFF" opacity="0.30"/>
    <rect x="614" y="392" width="260" height="224" rx="40" fill="#FFFFFF" opacity="0.30"/>
    <!-- Solid offset shadow of the front card, same clipped shape, one step down. -->
    <g transform="translate(0 26)">
      <rect x="292" y="344" width="440" height="320" rx="48" fill="#3E24C4" clip-path="url(#cut)"/>
    </g>
    <!-- The front card. -->
    <rect x="292" y="344" width="440" height="320" rx="48" fill="#FFFFFF" clip-path="url(#cut)"/>
    <!-- Three lines of clipping. The first is raspberry: the mark's second
         accent, one dash of it against all that violet. -->
    <rect x="352" y="418" width="210" height="28" rx="14" fill="#FF4D8D"/>
    <rect x="352" y="480" width="320" height="28" rx="14" fill="#6D4DFF" opacity="0.38"/>
    <rect x="352" y="542" width="260" height="28" rx="14" fill="#6D4DFF" opacity="0.38"/>
    <!-- The snipped corner, caught mid-fall. -->
    <polygon points="648,312 768,312 768,432" fill="#3E24C4" transform="translate(0 22) rotate(8 728 372)"/>
    <polygon points="648,312 768,312 768,432" fill="#C6FF3D" transform="rotate(8 728 372)"/>
    <!-- Which card is in front. -->
    <circle cx="472" cy="722" r="13" fill="#FFFFFF" opacity="0.5"/>
    <circle cx="512" cy="722" r="13" fill="#C6FF3D"/>
    <circle cx="552" cy="722" r="13" fill="#FFFFFF" opacity="0.5"/>
  </g>
</svg>
